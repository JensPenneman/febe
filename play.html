<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Febe" />
  <link rel="apple-touch-icon" href="icon.png" />
  <title>Febe — Luister &amp; Leer</title>
  <link rel="stylesheet" href="style.css" />
  <script src="data.js"></script>
</head>
<body>
  <header>
    <a id="back-link" href="index.html" class="back-link">&larr; Terug</a>
    <h1 id="page-title"></h1>
  </header>

  <main id="play-content" class="play-content"></main>

  <script>
    const languageNames = {
      sq: "Shqip",
      bs: "Bosanski",
      ru: "\u0420\u0443\u0441\u0441\u043A\u0438\u0439",
      en: "English",
      nl: "Nederlands",
    };

    const params = new URLSearchParams(window.location.search);
    const taskId = params.get("task");
    const childId = params.get("child");

    const task = APP_DATA.tasks.find((t) => t.id === taskId);
    const child = APP_DATA.children.find((c) => c.id === childId);

    if (!task || !child) {
      document.getElementById("page-title").textContent = "Niet gevonden";
    } else {
      document.getElementById("back-link").href = `task.html?id=${task.id}`;
      const titleEl = document.getElementById("page-title");
      const titleImg = document.createElement("img");
      titleImg.src = child.symbol;
      titleImg.alt = child.name;
      titleImg.className = "title-icon";
      titleEl.appendChild(titleImg);
      titleEl.appendChild(document.createTextNode(` ${child.name}`));

      const nativeSteps = task.steps[child.languageCode];
      const dutchSteps = task.steps.nl;
      const content = document.getElementById("play-content");
      const isDutch = child.languageCode === "nl";
      const nativeName = languageNames[child.languageCode] || child.languageCode;

      if (!nativeSteps) {
        content.innerHTML = "<p>Geen vertaling beschikbaar.</p>";
      } else {
        nativeSteps.forEach((nativeText, i) => {
          const step = document.createElement("div");
          step.className = "step-card";

          const stepNum = document.createElement("span");
          stepNum.className = "step-number";
          stepNum.textContent = i + 1;
          step.appendChild(stepNum);

          const stepBody = document.createElement("div");
          stepBody.className = "step-body";

          if (isDutch) {
            stepBody.appendChild(
              createLangBlock(dutchSteps[i], "nl", "Nederlands", "native")
            );
          } else {
            stepBody.appendChild(
              createLangBlock(nativeText, child.languageCode, nativeName, "native")
            );
            stepBody.appendChild(
              createLangBlock(dutchSteps[i], "nl", "Nederlands", "dutch")
            );
          }

          step.appendChild(stepBody);
          content.appendChild(step);
        });
      }

      // Big green "done" button
      const doneBtn = document.createElement("a");
      doneBtn.href = "scan.html";
      doneBtn.className = "done-btn";
      doneBtn.textContent = "\u2714\uFE0F Klaar!";
      content.appendChild(doneBtn);
    }

    function createLangBlock(text, langCode, langName, variant) {
      const block = document.createElement("div");
      block.className = `lang-block lang-block--${variant}`;

      const header = document.createElement("div");
      header.className = "lang-block__header";

      const label = document.createElement("span");
      label.className = "lang-block__label";
      label.lang = langCode;
      label.textContent = langName;
      header.appendChild(label);

      const playBtn = document.createElement("button");
      playBtn.type = "button";
      playBtn.className = "play-btn";
      playBtn.dataset.lang = langCode;
      playBtn.dataset.text = text;
      playBtn.setAttribute("aria-label", `Luister: ${text}`);
      playBtn.innerHTML = `<span class="play-icon">\u25B6\uFE0F</span>`;
      playBtn.addEventListener("click", () => speak(text, langCode, playBtn));
      header.appendChild(playBtn);

      block.appendChild(header);

      const textEl = document.createElement("p");
      textEl.className = "lang-block__text";
      textEl.lang = langCode;
      textEl.textContent = text;
      block.appendChild(textEl);

      return block;
    }

    function findVoice(langCode) {
      const voices = window.speechSynthesis.getVoices();
      const lc = langCode.toLowerCase();
      return (
        voices.find((v) => v.lang.toLowerCase() === lc) ||
        voices.find((v) => v.lang.toLowerCase().startsWith(lc + "-")) ||
        null
      );
    }

    let audioManifest = null;
    fetch("audio/manifest.json", { cache: "no-cache" })
      .then((r) => (r.ok ? r.json() : null))
      .then((m) => {
        audioManifest = m ? new Set(m.hashes) : new Set();
        refreshAllButtons();
      })
      .catch(() => {
        audioManifest = new Set();
        refreshAllButtons();
      });

    async function audioHash(lang, text) {
      const data = new TextEncoder().encode(`${lang}:${text}`);
      const buf = await crypto.subtle.digest("SHA-256", data);
      return Array.from(new Uint8Array(buf))
        .map((b) => b.toString(16).padStart(2, "0"))
        .join("")
        .slice(0, 16);
    }

    let activeAudio = null;
    function playAudioFile(src, btn) {
      window.speechSynthesis.cancel();
      if (activeAudio) {
        activeAudio.pause();
        activeAudio.currentTime = 0;
      }
      const audio = new Audio(src);
      activeAudio = audio;
      btn.classList.add("playing");
      const stop = () => {
        btn.classList.remove("playing");
        if (activeAudio === audio) activeAudio = null;
      };
      audio.addEventListener("ended", stop);
      audio.addEventListener("error", stop);
      audio.play().catch(stop);
    }

    async function refreshButton(btn) {
      const lang = btn.dataset.lang;
      const text = btn.dataset.text;
      let hasAudio = false;
      if (audioManifest && text) {
        const hash = await audioHash(lang, text);
        if (audioManifest.has(hash)) {
          btn.dataset.audio = `audio/${hash}.mp3`;
          hasAudio = true;
        }
      }
      const hasVoice = !!findVoice(lang);
      const playable = hasAudio || hasVoice;
      if (playable) {
        btn.classList.remove("play-btn--no-voice");
        btn.disabled = false;
        btn.title = "";
        btn.querySelector(".play-icon").textContent = "\u25B6\uFE0F";
      } else {
        btn.classList.add("play-btn--no-voice");
        btn.disabled = true;
        btn.title = "Geen stem beschikbaar voor deze taal op dit toestel";
        btn.classList.remove("playing");
        btn.querySelector(".play-icon").textContent = "\uD83D\uDD07";
      }
    }

    function refreshAllButtons() {
      document.querySelectorAll(".play-btn[data-lang]").forEach(refreshButton);
    }

    refreshAllButtons();
    if (typeof window.speechSynthesis !== "undefined") {
      window.speechSynthesis.addEventListener?.("voiceschanged", refreshAllButtons);
      window.speechSynthesis.onvoiceschanged = refreshAllButtons;
    }

    function speak(text, langCode, btn) {
      const audioSrc = btn.dataset.audio;
      if (audioSrc) {
        playAudioFile(audioSrc, btn);
        return;
      }

      window.speechSynthesis.cancel();
      if (activeAudio) {
        activeAudio.pause();
        activeAudio.currentTime = 0;
        activeAudio = null;
      }
      const voice = findVoice(langCode);
      if (!voice) return;

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.voice = voice;
      utterance.lang = voice.lang;
      utterance.rate = 0.85;

      btn.classList.add("playing");
      utterance.onend = () => btn.classList.remove("playing");
      utterance.onerror = () => btn.classList.remove("playing");

      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
